/* ---------- sidebar ---------- */
#sidebar{position:sticky;top:0;width:200px;flex:0 0 200px;height:100vh;height:100dvh;overflow-y:auto;padding:16px 12px 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);border-right:1px solid rgba(255,255,255,.7);box-shadow:6px 0 24px rgba(178,138,58,.10);user-select:none}
.side-logo{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;font-weight:800;color:#8a5f1e;font-size:15px;white-space:nowrap}
.side-logo .lg{font-size:24px}
#nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:13px;font-family:inherit;text-align:left;transition:.15s;white-space:nowrap}
.nav-item:hover{background:rgba(246,185,59,.14)}
.nav-item .nav-ico{font-size:20px;width:24px;text-align:center;flex:0 0 auto}
.nav-item.active{background:linear-gradient(135deg,#ffe4aa,#ffd075);box-shadow:0 5px 14px rgba(246,185,59,.4);color:#8a5f1e;font-weight:700}
@media(max-width:1023px){
  #sidebar{width:150px;flex:0 0 150px}
}
/* ---------- main ---------- */
#main{flex:1;min-width:0}
.content{max-width:1040px;margin:0 auto;padding:18px clamp(12px,3vw,28px) 48px}
/* ---------- banner ---------- */
.banner{position:relative;overflow:hidden;border-radius:22px;margin-bottom:16px;padding:20px 22px;min-height:104px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,rgba(255,248,224,.92),rgba(255,233,180,.9));box-shadow:var(--shadow)}
.banner-emoji{position:absolute;z-index:0;line-height:1;pointer-events:none}
.banner-avatar{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:#fff;object-fit:cover;box-shadow:0 4px 12px rgba(178,138,58,.25);z-index:1;position:relative;flex:0 0 auto}
.banner-txt{flex:1;min-width:0;z-index:1;position:relative}
.banner-txt h1{font-size:20px;color:#8a5f1e;font-weight:800}
.banner-txt p{font-size:12.5px;color:#a98650;margin-top:3px}
.banner-book{flex:0 0 auto;z-index:1;position:relative;display:flex;align-items:center;gap:6px;border:1.5px solid rgba(224,156,31,.4);background:rgba(255,255,255,.82);border-radius:999px;padding:8px 14px;font-size:13px;font-family:inherit;color:#8a5f1e;cursor:pointer;box-shadow:0 3px 10px rgba(178,138,58,.18);max-width:190px}
.bk-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:767px){
  .banner{padding:14px 12px;gap:10px;min-height:86px;margin-bottom:12px}
  .banner-avatar{width:52px;height:52px}
  .banner-txt h1{font-size:17px}
  .banner-book{padding:8px 10px;max-width:110px}
  .banner-book .bk-name{display:none}
}
/* ---------- cards & widgets ---------- */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:800;color:#8a5f1e;font-size:15px}
.card-title .ct-r{display:flex;align-items:center;gap:8px}
.stat-card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat-card .sc-l{font-size:12px;color:var(--ink-soft)}
.stat-card .sc-v{font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media(max-width:1023px){.grid6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){
  .grid2{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .grid3>*:last-child:nth-child(odd){grid-column:1/-1}
  .grid6{grid-template-columns:repeat(3,1fr)}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:11px 20px;font-size:14px;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#ffd075,#f0a92e);color:#6b4310;font-weight:700;box-shadow:0 5px 14px rgba(246,185,59,.4);transition:.15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.85);border:1.5px solid rgba(224,156,31,.45);color:#8a5f1e;box-shadow:none;font-weight:600}
.btn.danger{background:rgba(228,111,95,.14);color:#c05345;border:1.5px solid rgba(228,111,95,.35);box-shadow:none;font-weight:600}
.btn.sm{padding:7px 14px;font-size:12.5px}
.btn.full{width:100%}
.icon-btn{border:0;background:rgba(246,185,59,.16);border-radius:10px;width:30px;height:30px;cursor:pointer;font-size:13.5px;color:#8a5f1e;flex:0 0 auto}
.icon-btn.del{background:rgba(228,111,95,.14);color:#c05345}
.inp,.sel{width:100%;border:1.5px solid var(--line);border-radius:12px;background:rgba(255,255,255,.9);padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);outline:none}
.inp:focus,.sel:focus{border-color:var(--accent)}
.lbl{display:block;font-size:12px;color:var(--ink-soft);margin:10px 0 6px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.wrap{flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.chip.c{background:rgba(246,185,59,.2);color:#8a5f1e}
.chip.g{background:rgba(88,179,104,.16);color:#3d8a4d}
.chip.r{background:rgba(228,111,95,.16);color:#c05345}
.chip.b{background:rgba(111,159,216,.18);color:#3f6fae}
.chip.p{background:rgba(166,138,212,.18);color:#6d51a8}
.chip.pk{background:rgba(239,155,184,.2);color:#c4638b}
.chip.m{background:rgba(127,201,165,.2);color:#3c8f69}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed rgba(214,183,124,.4)}
.list-row:last-child{border-bottom:0}
.lr-ico{width:36px;height:36px;border-radius:12px;background:rgba(246,185,59,.15);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.lr-main{flex:1;min-width:0}
.lr-t{font-size:13.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr-s{font-size:11px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr-amt{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.lr-amt.in{color:#3d8a4d}.lr-amt.out{color:#c05345}
.empty{padding:26px 10px;text-align:center;color:var(--ink-faint);font-size:13px;border:1.5px dashed rgba(214,183,124,.55);border-radius:14px;background:rgba(255,255,255,.5);line-height:1.8}
.prog{height:10px;border-radius:999px;background:rgba(246,185,59,.18);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffd075,#f0a92e);transition:width .3s}
.seg{display:flex;background:rgba(246,185,59,.15);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:9px;padding:9px;background:transparent;font-family:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(178,138,58,.2);font-weight:700;color:#8a5f1e}
.tdot{width:10px;height:10px;border-radius:4px;flex:0 0 auto}
.mini-bar{display:flex;align-items:flex-end;gap:5px;height:90px}
.mini-bar .mb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.mini-bar .mb i{display:block;border-radius:4px 4px 2px 2px;min-height:2px}
.mini-bar .mb span{font-size:9px;color:var(--ink-soft);text-align:center}
/* ---------- finance ---------- */
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fin-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.fin-cover{position:relative;aspect-ratio:16/11;background:#e8dcc2}
.fin-cover img{width:100%;height:100%;object-fit:cover;display:block}
.fin-tag{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;color:#6b5b3e}
.fin-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#8a5f1e;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-weight:800}
.fin-body{padding:12px;display:flex;flex-direction:column;flex:1}
.fin-body h4{font-size:14px;color:#8a5f1e}
.fin-body p{font-size:11.5px;color:var(--ink-soft);margin:5px 0 10px;flex:1;line-height:1.55}
.fin-btns{display:flex;gap:8px}
.fin-btns .btn{flex:1;padding:8px 4px;font-size:12px;white-space:nowrap}
/* ---------- chart / calendar / period ---------- */
.chart{display:flex;align-items:flex-end;gap:6px;height:176px;padding-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.bar-val{font-size:9.5px;color:var(--ink-soft);white-space:nowrap}
.bar{width:72%;max-width:34px;border-radius:9px 9px 4px 4px;min-height:5px}
.bar-lab{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cal{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h3{font-size:15px;color:#8a5f1e}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{text-align:center;font-size:11px;color:var(--ink-soft);padding:4px 0}
.cal-cell{position:relative;min-height:54px;border-radius:12px;padding:5px 6px;font-size:12px;background:rgba(255,255,255,.55);border:1px dashed transparent;cursor:pointer;overflow:hidden}
.cal-cell:hover{background:rgba(246,185,59,.15)}
.cal-cell.today{border:1.5px solid var(--accent)}
.cal-cell.blank{background:transparent;cursor:default}
.cal-cell .amt{font-size:9px;line-height:1.55;margin-top:2px;font-weight:700;white-space:nowrap;overflow:hidden}
.cal-cell .amt.in{color:#3d8a4d}.cal-cell .amt.out{color:#c05345}
.p-period{background:rgba(242,139,168,.30)!important}
.p-ovu{background:rgba(127,179,232,.30)!important}
.p-luteal{background:rgba(245,185,113,.30)!important}
.p-period.pp{background:rgba(242,139,168,.16)!important}
.p-ovu.pp{background:rgba(127,179,232,.16)!important}
.p-luteal.pp{background:rgba(245,185,113,.16)!important}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink-soft)}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:3px}
/* ---------- modal / toast ---------- */
.modal-mask{position:fixed;inset:0;z-index:60;background:rgba(96,74,32,.38);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .18s}
.modal{background:#fffdf6;border-radius:20px;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;padding:20px;box-shadow:0 18px 50px rgba(96,74,32,.35);animation:pop .22s}
.modal.sm{max-width:380px}
.m-title{font-size:17px;font-weight:800;color:#8a5f1e;margin-bottom:6px}
.m-sub{font-size:12px;color:var(--ink-soft);margin-bottom:10px}
.book-list{display:flex;flex-direction:column;gap:10px;margin:12px 0 14px;max-height:48vh;overflow-y:auto}
.book-row{display:flex;align-items:center;gap:10px;border:2px solid rgba(214,183,124,.4);background:rgba(255,255,255,.78);border-radius:14px;padding:12px 14px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);text-align:left;width:100%}
.book-row:hover{border-color:var(--accent)}
.book-row.on{border-color:var(--accent);background:linear-gradient(135deg,#fff6dd,#ffecbd);box-shadow:0 4px 14px rgba(246,185,59,.35)}
.book-emoji{font-size:22px}
.book-cur{margin-left:auto;background:var(--accent);color:#6b4310;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:800;flex:0 0 auto}
.book-stats{font-size:11px;color:var(--ink-soft);flex:0 0 auto}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:80;background:rgba(90,64,20,.92);color:#fff7e8;padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.22);animation:pop .2s;max-width:86vw;text-align:center}
.mt10{margin-top:10px}.mt14{margin-top:14px}.mt4{margin-top:4px}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:8px;line-height:1.6}
.stat-layout{display:flex;gap:14px;flex-wrap:wrap}
.stat-layout .card{flex:1.5;min-width:300px;margin-bottom:0}
.stat-side{flex:1;min-width:280px}
@media(max-width:640px){.stat-layout .card{min-width:100%}.stat-side{min-width:100%}}
.mb0{margin-bottom:0}
/* ===== 移动端优化（置于样式表末尾，确保覆盖基础规则） ===== */
@media(max-width:767px){
  #sidebar{width:60px;flex:0 0 60px;padding:10px 4px 18px}
  .side-logo{justify-content:center;padding:2px 0 12px}
  .side-logo .sl-txt{display:none}
  .nav-item{flex-direction:column;gap:2px;padding:9px 2px;border-radius:12px;font-size:8.5px;text-align:center;min-height:46px;justify-content:center}
  .nav-item .nav-ico{width:auto;font-size:21px}
  /* 内容区：留白收紧，触控目标放大 */
  .content{padding:12px 10px 40px}
  .card{padding:14px;border-radius:16px;margin-bottom:12px}
  .stat-card{padding:12px;border-radius:14px}
  .sc-v{font-size:18px}
  .list-row{padding:12px 2px;gap:8px}
  .lr-ico{width:40px;height:40px;border-radius:12px;font-size:19px}
  .lr-amt{font-size:15px}
  .icon-btn{width:40px;height:40px;font-size:15px;border-radius:12px}
  .btn{min-height:44px;padding:11px 16px}
  .btn.sm{min-height:38px;padding:8px 12px;font-size:12px}
  .inp,.sel{padding:11px 12px;font-size:14px}
  .card-title{margin-bottom:10px}
}
@media(max-width:640px){
  .fin-body{padding:10px}
  .fin-body p{font-size:11px;margin:4px 0 8px}
  .fin-btns{gap:6px}
  .fin-btns .btn{padding:9px 2px;font-size:11.5px;min-height:40px}
  .fin-play{width:42px;height:42px}
}
</style>
</head>

<div id="app">
  <aside id="sidebar">
    <div class="side-logo"><span class="lg">⭐</span><span class="sl-txt">星星人记账</span></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"><div class="content">
    <header id="banner"></header>
    <section id="view"></section>
  </div></main>
</div>
<div id="modal"></div>
<div id="toasts"></div>

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function money(n){n=num(n);var a=Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?'-¥':'¥')+a;}
function money0(n){n=num(n);var a=Math.abs(n).toLocaleString('zh-CN',{maximumFractionDigits:2});return (n<0?'-¥':'¥')+a;}
function pad(n){return String(n).padStart(2,'0');}
function toYMD(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return toYMD(new Date());}
function curMonth(){return today().slice(0,7);}
function addDays(ymd,n){var p=ymd.split('-').map(Number);var d=new Date(p[0],p[1]-1,p[2]+n);return toYMD(d);}
function addMonths(ym,n){var p=ym.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);return toYMD(d).slice(0,7);}
function diffDays(a,b){var p1=a.split('-').map(Number),p2=b.split('-').map(Number);return Math.round((new Date(p2[0],p2[1]-1,p2[2])-new Date(p1[0],p1[1]-1,p1[2]))/864e5);}
function monthCn(ym){var p=ym.split('-').map(Number);return p[0]+'年'+p[1]+'月';}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function seed(){
 var b={id:uid(),name:'默认账本',emoji:'📖',createdAt:today()};
 return {version:1,currentBookId:b.id,books:[b],transactions:[],accounts:[],budgets:[],loans:[],goals:[],templates:[],recycles:[],todos:[],fitness:{},periods:{}};
}
function loadState(){
 try{
  var raw=localStorage.getItem(KEY);
  if(!raw)return seed();
  var s=JSON.parse(raw);
  if(!s||!Array.isArray(s.books)||!s.books.length)return seed();
  if(!s.currentBookId||!s.books.some(function(b){return b.id===s.currentBookId;}))s.currentBookId=s.books[0].id;
  ['transactions','accounts','budgets','loans','goals','templates','recycles','todos'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=[];});
  if(!s.fitness)s.fitness={};if(!s.periods)s.periods={};
  return s;
 }catch(e){return seed();}
}

 var g=x.createLinearGradient(cx,cy-h/2,cx,cy+h/2);
 g.addColorStop(0,top);g.addColorStop(1,bot);
 x.fillStyle=g;
 x.beginPath();
 var r=Math.min(10,h/2);
 x.moveTo(cx-w/2+r,cy-h/2);x.lineTo(cx+w/2-r,cy-h/2);x.quadraticCurveTo(cx+w/2,cy-h/2,cx+w/2,cy-h/2+r);
 x.lineTo(cx+w/2,cy+h/2-r);x.quadraticCurveTo(cx+w/2,cy+h/2,cx+w/2-r,cy+h/2);
 x.lineTo(cx-w/2+r,cy+h/2);x.quadraticCurveTo(cx-w/2,cy+h/2,cx-w/2,cy+h/2-r);
 x.lineTo(cx-w/2,cy-h/2+r);x.quadraticCurveTo(cx-w/2,cy-h/2,cx-w/2+r,cy-h/2);
 x.fill();
 x.fillStyle='rgba(255,255,255,.35)';x.fillRect(cx-w/2+6,cy-h/2+4,w-12,3);
 x.fillStyle='rgba(0,0,0,.15)';x.fillRect(cx-w/2+6,cy+h/2-7,w-12,3);
}
function covCandle(x,cx,y,wid,hgt,col){
 x.fillStyle=col;x.fillRect(cx-wid/2,Math.min(y,y+hgt),wid,Math.abs(hgt));
 x.fillStyle=col;x.fillRect(cx-1,Math.min(y,y+hgt)-6,2,Math.abs(hgt)+12);
}
function genCover(theme){
 var w=640,h=440;
 var c=document.createElement('canvas');c.width=w;c.height=h;
 var x=c.getContext('2d');
 if(theme==='gold'){
  covGrad(x,'#f6cd6f','#c98f2a',w,h);
  covBlur(x,'rgba(255,248,200,.75)',30,30,220,140,26);
  covBlur(x,'rgba(255,240,180,.5)',380,260,240,160,30);
  covIngot(x,470,120,240,64,'#f4dc92','#c89b32');
  covIngot(x,150,340,230,60,'#f4dc92','#c3932f');
  covCoin(x,480,320,52);covCoin(x,120,120,40);covCoin(x,590,220,30);
  var g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,w*0.5,h);
 }else if(theme==='silver'){
  covGrad(x,'#d6e0ec','#7088a4',w,h);
  covBlur(x,'rgba(255,255,255,.8)',0,0,260,200,30);
  covIngot(x,230,190,280,80,'#f0f5fa','#97a9bf');
  covIngot(x,420,330,260,70,'#eef3f9','#8fa2b8');
  covIngot(x,130,360,200,56,'#e8eef5','#8298b0');
  covBlur(x,'rgba(255,255,255,.55)',120,60,140,220,18);
 }else if(theme==='fund'){
  covGrad(x,'#3aa878','#125c3c',w,h);
  covBlur(x,'rgba(255,255,255,.28)',20,10,200,120,24);
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=1;
  for(var gy=60;gy<h;gy+=60){x.beginPath();x.moveTo(0,gy);x.lineTo(w,gy);x.stroke();}
  var base=h-90,px=[60,140,220,300,380,460,540],vals=[40,90,26,120,70,150,96];
  x.save();
  try{x.filter='blur(1px)';}catch(e){}
  for(var i2=0;i2<px.length;i2++){
   var up=vals[i2]>70,ch=(up?'#b1e3b6':'#e07a6a');
   covCandle(x,px[i2],base-vals[i2],22,vals[i2],ch);
  }
  var g2=x.createLinearGradient(0,40,0,h);
  g2.addColorStop(0,'rgba(125,224,168,.95)');g2.addColorStop(1,'rgba(125,224,168,.15)');
  x.strokeStyle=g2;x.lineWidth=5;x.lineJoin='round';
  x.beginPath();x.moveTo(60,base+30);
  x.lineTo(140,base-6);x.lineTo(220,base+18);x.lineTo(300,base-36);
  x.lineTo(380,base-2);x.lineTo(460,base-56);x.lineTo(540,base-24);
  x.stroke();
  x.restore();
 }else if(theme==='stock'){
  covGrad(x,'#152b5e','#0a153d',w,h);
  x.strokeStyle='rgba(255,255,255,.09)';x.lineWidth=1;
  for(var gy2=50;gy2<h;gy2+=55){x.beginPath();x.moveTo(0,gy2);x.lineTo(w,gy2);x.stroke();}
  var px2=[70,150,230,310,390,470,550],vals2=[60,130,40,160,90,180,70];
  for(var i3=0;i3<px2.length;i3++){
   var up2=vals2[i3]>100,ch2=up2?'#e8503f':'#3fae6a';
   covCandle(x,px2[i3],h-70-vals2[i3],26,vals2[i3],ch2);
  }
  covBlur(x,'rgba(232,80,63,.28)',300,180,200,90,26);
  var g3=x.createLinearGradient(0,30,0,h);
  g3.addColorStop(0,'rgba(255,255,255,.95)');g3.addColorStop(1,'rgba(255,255,255,.1)');
  x.save();x.strokeStyle=g3;x.lineWidth=4;
  x.beginPath();x.moveTo(50,h-40);x.lineTo(200,h-90);x.lineTo(360,h-60);x.lineTo(560,h-130);x.stroke();x.restore();
 }else if(theme==='fx'){
  covGrad(x,'#2ba3a3','#4a52a8',w,h);
  var g4=x.createLinearGradient(w*0.5,0,w,h);
  g4.addColorStop(0,'rgba(215,106,133,.55)');g4.addColorStop(1,'rgba(215,106,133,0)');
  x.fillStyle=g4;x.fillRect(w*0.35,0,w*0.65,h);
  covBlur(x,'rgba(255,255,255,.55)',40,30,180,120,24);
  var syms=[['$',120,150,140,'rgba(255,255,255,.90)'],['€',330,120,300,'rgba(255,255,255,.75)'],['¥',520,190,420,'rgba(255,255,255,.85)'],['£',210,300,380,'rgba(255,255,255,.6)'],['₩',470,320,260,'rgba(255,255,255,.55)']];
  x.textAlign='center';x.textBaseline='middle';
  for(var i4=0;i4<syms.length;i4++){
   x.save();x.translate(syms[i4][1],syms[i4][2]);x.rotate((Math.random()*0.5-0.25));
   x.font='bold '+syms[i4][3]+'px Georgia,serif';x.fillStyle=syms[i4][4];
   if(i4<3){x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=14;}
   x.fillText(syms[i4][0],0,0);x.restore();
  }
 }else{ /* pick */
  covGrad(x,'#f9aecb','#d9588c',w,h);
  covBlur(x,'rgba(255,255,255,.65)',340,20,220,150,30);
  covBlur(x,'rgba(255,214,228,.6)',20,260,200,140,26);
  x.fillStyle='#fff';x.fillRect(230,200,180,150);
  x.fillStyle='rgba(196,60,120,.25)';x.fillRect(230,200,180,10);
  x.fillStyle='#c95f8f';x.fillRect(308,200,24,150);
  x.fillStyle='#c95f8f';x.fillRect(230,262,180,20);
  x.strokeStyle='#c95f8f';x.lineWidth=12;x.lineCap='round';
  x.beginPath();x.moveTo(238,208);x.quadraticCurveTo(268,150,318,205);x.stroke();
  x.beginPath();x.moveTo(402,208);x.quadraticCurveTo(372,150,322,205);x.stroke();
  x.fillStyle='rgba(255,255,255,.95)';
  [[150,120],[480,110],[540,300],[120,300],[420,60]].forEach(function(p){
   var cx=p[0],cy=p[1];
   x.beginPath();
   x.moveTo(cx,cy-11);x.lineTo(cx+3,cy-3);x.lineTo(cx+11,cy);x.lineTo(cx+3,cy+3);x.lineTo(cx,cy+11);x.lineTo(cx-3,cy+3);x.lineTo(cx-11,cy);x.lineTo(cx-3,cy-3);
   x.closePath();x.fill();
  });
  covCoin(x,500,180,34);
 }
 covNoise(x,w,h,0.05);
 covVignette(x,w,h);
 return c.toDataURL('image/jpeg',0.85);
}

function copyFin(u){
 function fallback(){
  var ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('链接已复制');}catch(e){toast('复制失败，请手动复制');}

 }

 else{fallback();}
}

/* ================= 视图：周期 ================= */
function nextRun(r){
 var t=today();
 var p=t.split('-').map(Number);
 if(r.freq==='weekly'){
  var wd=r.day||1;
  var curD=(new Date().getDay()+6)%7+1;
  var diff=wd-curD;if(diff<0)diff+=7;
  if(diff===0&&r.lastRun===t)diff=7;
  return addDays(t,diff);
 }
 if(r.freq==='monthly'){
  var y=p[0],m=p[1],d=r.day||1;
  function getDay(yy,mm2){return Math.min(d,new Date(yy,mm2,0).getDate());}
  var cand=toYMD(new Date(y,m-1,getDay(y,m)));
  if(cand<t||(cand===t&&r.lastRun===t)){
   var ny=y,nm=m+1;if(nm>12){nm=1;ny++;}
   cand=toYMD(new Date(ny,nm-1,getDay(ny,nm)));
  }
  return cand;
 }
 var y3=p[0],mm=r.month||1,dd=r.day||1;
 var c1=toYMD(new Date(y3,mm-1,Math.min(dd,new Date(y3,mm,0).getDate())));
 if(c1<t||(c1===t&&r.lastRun===t)){
  c1=toYMD(new Date(y3+1,mm-1,Math.min(dd,new Date(y3+1,mm,0).getDate())));
 }
 return c1;
}

 (recs.length?recs.map(function(r){
  var freqTxt={weekly:'每周',monthly:'每月',yearly:'每年'}[r.freq];
  var dayTxt=r.freq==='weekly'?('周'+(['一','二','三','四','五','六','日'][(r.day||1)-1])):(r.freq==='monthly'?(r.day+' 日'):(r.month+' 月 '+r.day+' 日'));
  return '<div class="list-row" style="flex-wrap:wrap"><div class="lr-ico">'+(CAT_EMOJI[r.category]||'📦')+'</div>'+

 }).join(''):'<div class="empty">还没有周期账目～<br>房租、话费、订阅费都能自动提醒</div>')+'</div>';
};

function recDayHtml(freq,r){
 if(freq==='weekly'){
  var days=['周一','周二','周三','周四','周五','周六','周日'];
  return '<label class="lbl">星期</label><select class="sel" id="rf-day">'+days.map(function(d,i){return '<option value="'+(i+1)+'"'+(r&&r.freq==='weekly'&&r.day===i+1?' selected':'')+'>'+d+'</option>';}).join('')+'</select>';
 }
 if(freq==='monthly'){
  var opts='';for(var i=1;i<=31;i++){opts+='<option value="'+i+'"'+(r&&r.freq==='monthly'&&r.day===i?' selected':'')+'>'+i+' 日</option>';}
  return '<label class="lbl">每月日期（超过当月天数的按月末算）</label><select class="sel" id="rf-day">'+opts+'</select>';
 }
 var mOpts='';for(var i2=1;i2<=12;i2++){mOpts+='<option value="'+i2+'"'+(r&&r.freq==='yearly'&&r.month===i2?' selected':'')+'>'+i2+' 月</option>';}
 var dOpts='';for(var i3=1;i3<=31;i3++){dOpts+='<option value="'+i3+'"'+(r&&r.freq==='yearly'&&r.day===i3?' selected':'')+'>'+i3+' 日</option>';}
 return '<div class="lbl">每年</div><div class="row"><select class="sel" id="rf-month">'+mOpts+'</select><select class="sel" id="rf-day">'+dOpts+'</select></div>';
}

/* ================= 视图：经期助手 ================= */
function phaseClasses(ym){
 /* 返回 {ym: {day: {cls,pred}}}: 计算当月每天的阶段 */
 var pid=cur();
 var pp=S.periods[pid];
 var out={};
 if(!pp)return out;
 var recs=pp.records||[];
 /* 显式记录优先 */
 for(var d=1;d<=31;d++){
  var ds=toYMD(new Date(+ym.split('-')[0],+ym.split('-')[1]-1,d));
  if(ds.slice(0,7)!==ym)break;
  var cls='';
  for(var i=0;i<recs.length;i++){
   var r=recs[i];
   if(ds>=r.start&&ds<=(r.end||r.start)){
    cls=r.phase;break;
   }
  }
  if(cls)out[ds]={cls:cls,pred:false};
 }
 /* 预测（仅基于末次经期） */
 if(pp.profile&&pp.profile.lastStart){
  var cyc=num(pp.profile.cycleLen)||28,plen=num(pp.profile.periodLen)||5;
  var last=pp.profile.lastStart;
  var k=Math.max(1,Math.floor(diffDays(last,today())/cyc));
  var start=addDays(last,k*cyc);
  var guard=0;
  while(start<=today()&&guard<100){k++;start=addDays(last,k*cyc);guard++;}
  var ovu=addDays(start,-14);
  var lutealS=addDays(ovu,1),lutealE=addDays(start,-1);
  for(d=1;d<=31;d++){
   var ds2=toYMD(new Date(+ym.split('-')[0],+ym.split('-')[1]-1,d));
   if(ds2.slice(0,7)!==ym)break;
   if(out[ds2])continue;
   if(ds2>=start&&ds2<=addDays(start,plen-1))out[ds2]={cls:'period',pred:true};
   else if(ds2===ovu)out[ds2]={cls:'ovulation',pred:true};
   else if(ds2>=lutealS&&ds2<=lutealE)out[ds2]={cls:'luteal',pred:true};
  }
 }
 return out;
}

  predHtml='<div class="card"><div class="card-title"><span>🔮 预测</span></div><div class="empty">填写末次经期开始日后即可预测<br><button class="btn sm mt10" onclick="APP.perForm()">填写档案</button></div></div>';
 }
 var phaseMeta={period:['🩸 生理期','p-period'],ovulation:['💧 排卵期','p-ovu'],luteal:['🌙 黄体期','p-luteal']};
 var recHtml=recs.slice().sort(function(a,b){return b.start<a.start?1:-1;}).map(function(r){
  var mt=phaseMeta[r.phase]||['📌',r.phase,''];
  return '<div class="list-row"><div class="lr-ico" style="background:rgba(242,139,168,.16)">'+mt[0]+'</div>'+
   '<div class="lr-main"><div class="lr-t">'+mt[0]+'</div><div class="lr-s">'+r.start+(r.end&&r.end!==r.start?' ~ '+r.end:'')+(r.note?' · '+esc(r.note):'')+'</div></div>'+
   '<button class="icon-btn" onclick="APP.perRecForm(\''+r.id+'\')">✏️</button>'+
   '<button class="icon-btn del" onclick="APP.delPerRec(\''+r.id+'\')">🗑</button></div>';
 }).join('');
 var p=ym.split('-').map(Number);
 var y=p[0],m=p[1];
 var firstWd=(new Date(y,m-1,1).getDay()+6)%7;
 var days=new Date(y,m,0).getDate();
 var phases=phaseClasses(ym);
 var cells='';
 for(var i=0;i<firstWd;i++){cells+='<div class="cal-cell blank"></div>';}
 for(var d=1;d<=days;d++){
  var ds=toYMD(new Date(y,m-1,d));
  var ph=phases[ds];
  var cls='';
  if(ph){cls=phaseMeta[ph.cls][1]+(ph.pred?' pp':'');}
  cells+='<div class="cal-cell'+cls+(ds===today()?' today':'')+'"><div>'+d+'</div></div>';
 }
 $('#view').innerHTML=predHtml+
 '<div class="card"><div class="card-title"><span>🌸 周期档案</span><button class="btn ghost sm" onclick="APP.perForm()">编辑</button></div>'+
 (prof?'<div class="row wrap" style="gap:8px"><span class="chip pk">周期 '+prof.cycleLen+' 天</span><span class="chip b">经期 '+prof.periodLen+' 天</span><span class="chip c">末次 '+prof.lastStart+'</span></div>':'<div class="empty">还未建立周期档案</div>')+'</div>'+
 '<div class="cal"><div class="cal-head"><button class="btn ghost sm" onclick="APP.perCalNav(-1)">‹</button><h3>'+monthCn(ym)+'</h3><button class="btn ghost sm" onclick="APP.perCalNav(1)">›</button></div>'+
 '<div class="cal-grid">'+['一','二','三','四','五','六','日'].map(function(w){return '<div class="cal-wd">'+w+'</div>';}).join('')+cells+'</div>'+
 '<div class="legend"><span><i style="background:rgba(242,139,168,.35)"></i>生理期</span><span><i style="background:rgba(127,179,232,.35)"></i>排卵期</span><span><i style="background:rgba(245,185,113,.35)"></i>黄体期</span><span><i style="background:rgba(242,139,168,.15);border:1px dashed rgba(242,139,168,.5)"></i>预测</span></div></div>'+
 '<div class="card"><div class="card-title"><span>📝 周期记录</span><button class="btn sm" onclick="APP.perRecForm()">＋ 记录</button></div>'+
 (recHtml||'<div class="empty">还没有周期记录～<br>记录经期、排卵或黄体期，预测更准确</div>')+'</div>';
};
function perForm(){
 var pid=cur();
 var pp=S.periods[pid]||{};
 var p=pp.profile||{};
 openModal('<div class="modal"><div class="m-title">🌸 周期档案</div>'+
  '<div class="grid2"><div><label class="lbl">周期长度（天）</label><input class="inp" id="pf-cyc" type="number" min="15" max="60" value="'+(p.cycleLen||'28')+'"></div>'+
  '<div><label class="lbl">经期长度（天）</label><input class="inp" id="pf-plen" type="number" min="1" max="15" value="'+(p.periodLen||'5')+'"></div></div>'+
  '<label class="lbl">末次经期开始日</label><input class="inp" id="pf-last" type="date" value="'+(p.lastStart||'')+'">'+
  '<div class="row mt14"><button class="btn ghost" onclick="APP.closeModal()">取消</button><button class="btn" style="flex:1" onclick="APP.savePerProfile()">保存</button></div></div>');
}
function savePerProfile(){
 var cyc=Math.round(num($('#pf-cyc').value)),plen=Math.round(num($('#pf-plen').value));
 if(cyc<15||cyc>60){toast('周期长度需在 15-60 天之间');return;}
 if(plen<1||plen>15){toast('经期长度需在 1-15 天之间');return;}
 var pid=cur();
 var pp=S.periods[pid]||{profile:{},records:[]};
 pp.profile={cycleLen:cyc,periodLen:plen,lastStart:$('#pf-last').value||''};
 S.periods[pid]=pp;
 save();closeModal();render();toast('档案已保存');
}
function perRecForm(id){
 var pid=cur();
 var pp=S.periods[pid]||{profile:{},records:[]};
 var r=id?pp.records.filter(function(x){return x.id===id;})[0]:null;
 openModal('<div class="modal"><div class="m-title">'+(r?'编辑记录':'新增周期记录')+'</div>'+
  '<label class="lbl">阶段</label><select class="sel" id="prf-phase">'+
  '<option value="period"'+(r&&r.phase==='period'?' selected':'')+'>🩸 生理期</option>'+
  '<option value="ovulation"'+(r&&r.phase==='ovulation'?' selected':'')+'>💧 排卵期</option>'+
  '<option value="luteal"'+(r&&r.phase==='luteal'?' selected':'')+'>🌙 黄体期</option></select>'+
  '<label class="lbl">开始日期</label><input class="inp" id="prf-start" type="date" value="'+(r?r.start:today())+'">'+
  '<label class="lbl">结束日期（选填）</label><input class="inp" id="prf-end" type="date" value="'+(r&&r.end&&r.end!==r.start?r.end:'')+'">'+
  '<label class="lbl">备注（选填）</label><input class="inp" id="prf-note" maxlength="30" value="'+esc(r?r.note:'')+'">'+
  '<div class="row mt14"><button class="btn ghost" onclick="APP.closeModal()">取消</button><button class="btn" style="flex:1" onclick="APP.savePerRec(\''+(r?r.id:'')+'\')">保存</button></div></div>');
}
function savePerRec(id){
 var pid=cur();
 var pp=S.periods[pid]||{profile:{},records:[]};
 var start=$('#prf-start').value;
 if(!start){toast('请选择开始日期');return;}
 var end=$('#prf-end').value;
 if(end&&end<start){toast('结束日期不能早于开始日期');return;}
 var rec={id:id||uid(),bookId:pid,phase:$('#prf-phase').value,start:start,end:end||start,note:($('#prf-note').value||'').trim()};
 if(id){pp.records=pp.records.map(function(x){return x.id===id?Object.assign({},x,rec):x;});}
 else{pp.records.push(rec);}
 S.periods[pid]=pp;
 save();closeModal();render();toast(id?'已更新':'已记录');
}
function delPerRec(id){
 var pid=cur();
 var pp=S.periods[pid];
 confirmAct('确定删除该记录吗？',function(){
  pp.records=pp.records.filter(function(x){return x.id!==id;});
  save();closeModal();render();toast('已删除');
 });
}
/* ================= 视图：设置 ================= */
VIEWS.settings=function(){
 var kb=(JSON.stringify(S).length/1024).toFixed(1);
 $('#view').innerHTML=
 '<div class="card"><div class="card-title"><span>📦 数据概览</span></div>'+
 '<div class="grid3">'+
  '<div class="stat-card" style="margin:0"><div class="sc-l">账本</div><div class="sc-v" style="font-size:17px">'+S.books.length+'</div></div>'+
  '<div class="stat-card" style="margin:0"><div class="sc-l">明细</div><div class="sc-v" style="font-size:17px">'+S.transactions.length+'</div></div>'+
  '<div class="stat-card" style="margin:0"><div class="sc-l">账户</div><div class="sc-v" style="font-size:17px">'+S.accounts.length+'</div></div>'+
  '<div class="stat-card" style="margin:0"><div class="sc-l">预算</div><div class="sc-v" style="font-size:17px">'+S.budgets.length+'</div></div>'+
  '<div class="stat-card" style="margin:0"><div class="sc-l">借贷</div><div class="sc-v" style="font-size:17px">'+S.loans.length+'</div></div>'+
  '<div class="stat-card" style="margin:0"><div class="sc-l">目标/模板/周期</div><div class="sc-v" style="font-size:17px">'+(S.goals.length+S.templates.length+S.recycles.length)+'</div></div>'+
 '</div><div class="hint mt10">本地存储占用约 '+kb+' KB（localStorage 上限通常为 5MB）</div></div>'+
 '<div class="card"><div class="card-title"><span>💾 备份与恢复</span></div>'+
 '<div class="row wrap" style="gap:10px">'+
  '<button class="btn" onclick="APP.exportData()">⬇️ 导出备份</button>'+
  '<label class="btn ghost" style="cursor:pointer">⬆️ 导入恢复<input type="file" accept=".json,application/json" style="display:none" onchange="APP.importData(this)"></label>'+
 '</div><div class="hint mt10">导出得到 JSON 备份文件，可跨设备迁移；导入会覆盖当前数据。</div></div>'+
 '<div class="card"><div class="card-title"><span>⚠️ 危险操作</span></div>'+
 '<button class="btn danger" onclick="APP.resetAll()">🗑 清空全部数据</button>'+
 '<div class="hint mt10">清空后所有账本与数据将永久丢失，请先导出备份。</div></div>'+
 '<div class="card"><div class="card-title"><span>ℹ️ 关于</span></div>'+
 '<p style="font-size:12.5px;line-height:1.9;color:var(--ink-soft)">星星人记账工作台 v1.0 · 纯前端单页应用<br>全部数据仅保存在本设备浏览器 localStorage 中，无任何后端与上传。<br>更换浏览器、清理缓存或使用无痕模式会导致数据不可见，请定期导出备份。</p></div>';
};
function exportData(){
 var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 var a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='zzx-book-'+(today())+'.json';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
 toast('备份文件已下载');
}
function importData(input){
 var f=input.files&&input.files[0];
 if(!f)return;
 var rd=new FileReader();
 rd.onload=function(){
  try{
   var s=JSON.parse(rd.result);
   if(!s||s.version!==1||!Array.isArray(s.books)||!s.books.length){toast('文件格式不正确');return;}
   confirmAct('导入将<b>覆盖当前全部数据</b>（'+s.books.length+' 个账本），确定继续吗？',function(){
    S=s;save();closeModal();render();
    toast('导入成功');
   });
  }catch(e){toast('文件解析失败');}
 };
 rd.readAsText(f);
 input.value='';
}
function resetAll(){
 confirmAct('确定要<b>清空全部数据</b>吗？此操作不可恢复！',function(){
  localStorage.removeItem(KEY);
  S=seed();save();render();toast('已重置为初始状态');
 });
}
/* ================= 启动 ================= */
document.addEventListener('visibilitychange',function(){if(!document.hidden){render();}});
(function init(){
 var m=location.hash.replace(/^#m=/,'');
 if(MODULES.some(function(x){return x.id===m;}))UI.module=m;
 ensureAvatars().then(function(){
  render();
 }).catch(function(){toast('头像加载失败');render();});
})();
</script>
