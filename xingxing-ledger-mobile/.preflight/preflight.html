    <style id="theme-vars">
/* 星星人记账工作台 — 温馨可爱风移动端设计系统 */

:root {
  /* Brand primary scale — warm golden, single identity hue */
  --xingxing-primary-50: #fff9e6;
  --xingxing-primary-100: #ffefbd;
  --xingxing-primary-200: #ffe494;
  --xingxing-primary-300: #ffd56a;
  --xingxing-primary-400: #ffc241;
  --xingxing-primary-500: #f6b93b;
  --xingxing-primary-600: #e09c1f;
  --xingxing-primary-700: #b87a12;
  --xingxing-primary-800: #8a5f1e;
  --xingxing-primary-900: #5c3f14;

  /* Neutral scale — warm cream/brown */
  --xingxing-cream: #fff9ed;
  --xingxing-cream-2: #f7ecd7;
  --xingxing-cream-3: #f0dec0;
  --xingxing-brown-50: #fdf8f0;
  --xingxing-brown-100: #f5ecd9;
  --xingxing-brown-200: #eaddc3;
  --xingxing-brown-300: #d8c6a3;
  --xingxing-brown-400: #bfa87e;
  --xingxing-brown-500: #9f8962;
  --xingxing-brown-600: #7d6a4a;
  --xingxing-brown-700: #5c4d35;
  --xingxing-brown-800: #4a3d2a;
  --xingxing-brown-900: #2e251a;

  /* Semantic surface tokens */
  --xingxing-background: #fff9ed;
  --xingxing-foreground: #4a3d2a;
  --xingxing-card: rgba(255, 255, 255, 0.92);
  --xingxing-card-foreground: #4a3d2a;
  --xingxing-popover: #ffffff;
  --xingxing-popover-foreground: #4a3d2a;
  --xingxing-primary: #f6b93b;
  --xingxing-primary-foreground: #5c3f14;
  --xingxing-muted: #f5ecd9;
  --xingxing-muted-foreground: #9f8962;
  --xingxing-border: rgba(191, 168, 126, 0.35);
  --xingxing-input: rgba(191, 168, 126, 0.35);
  --xingxing-ring: #f6b93b;

  /* State colors */
  --xingxing-state-success: #58b368;
  --xingxing-state-success-bg: rgba(88, 179, 104, 0.12);
  --xingxing-state-warning: #f2a65a;
  --xingxing-state-warning-bg: rgba(242, 166, 90, 0.12);
  --xingxing-state-error: #e46f5f;
  --xingxing-state-error-bg: rgba(228, 111, 95, 0.12);
  --xingxing-state-info: #6f9fd8;
  --xingxing-state-info-bg: rgba(111, 159, 216, 0.12);

  /* Radius scale — restrained, mobile-friendly */
  --xingxing-radius-small: 8px;
  --xingxing-radius-medium: 12px;
  --xingxing-radius-large: 16px;
  --xingxing-radius-full: 9999px;

  /* Shadows — only floating layers exceed 0.05 alpha */
  --xingxing-shadow-sm: 0 2px 6px rgba(140, 110, 60, 0.05);
  --xingxing-shadow-md: 0 4px 12px rgba(140, 110, 60, 0.05);
  --xingxing-shadow-lg: 0 8px 24px rgba(140, 110, 60, 0.08);
  --xingxing-shadow-float: 0 18px 50px rgba(90, 64, 20, 0.18);

  /* Typography */
  --xingxing-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --xingxing-font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* Layout */
  --xingxing-safe-top: env(safe-area-inset-top, 0px);
  --xingxing-safe-bottom: env(safe-area-inset-bottom, 0px);
  --xingxing-nav-height: 64px;
  --xingxing-max-width: 480px;
}

@theme inline {
  --color-background: var(--xingxing-background);
  --color-foreground: var(--xingxing-foreground);
  --color-card: var(--xingxing-card);
  --color-card-foreground: var(--xingxing-card-foreground);
  --color-popover: var(--xingxing-popover);
  --color-popover-foreground: var(--xingxing-popover-foreground);
  --color-primary: var(--xingxing-primary);
  --color-primary-foreground: var(--xingxing-primary-foreground);
  --color-muted: var(--xingxing-muted);
  --color-muted-foreground: var(--xingxing-muted-foreground);
  --color-border: var(--xingxing-border);
  --color-input: var(--xingxing-input);
  --color-ring: var(--xingxing-ring);
  --radius-sm: var(--xingxing-radius-small);
  --radius-md: var(--xingxing-radius-medium);
  --radius-lg: var(--xingxing-radius-large);
  --radius-full: var(--xingxing-radius-full);
}

@layer base {
  html {
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: var(--xingxing-font-sans);
    background: var(--xingxing-background);
    color: var(--xingxing-foreground);
    line-height: 1.5;
  }
}
